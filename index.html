<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10. Sınıf Coğrafya Yarışması</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
            user-select: none;
        }

        #floating-area {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
        }

        .floating-name {
            position: absolute;
            font-size: 13px;
            font-weight: bold;
            background: #ffffff;
            border: 2px solid #000;
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: grab;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.1);
            touch-action: none;
        }

        /* ÖZEL İSİMLER */
        .special-emir {
            border-color: #9b59b6 !important;
            color: #8e44ad !important;
            box-shadow: 0 0 15px #9b59b6, 0 0 25px #8e44ad !important;
        }

        .special-berat {
            border-color: #2c3e50 !important;
            background: #2c3e50 !important;
            color: #fff !important;
        }

        .special-kutluhan {
            border-color: #f1c40f !important;
            color: #d35400 !important;
            box-shadow: 0 0 15px #f1c40f !important;
            background: #ffeaa7 !important;
        }

        .special-yagmur {
            border-color: #d4ac0d !important;
            color: #b7950b !important;
            background: #fef9e7 !important;
        }

        .controls {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-align: center;
        }

        .btn-start {
            font-size: 18px;
            padding: 15px 30px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        #explosion {
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 20px;
            background: radial-gradient(circle, #ffffff 10%, #ffeaa7 40%, rgba(255,255,255,0) 80%);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 99;
            box-shadow: 0 0 100px 50px #fff, 0 0 200px 100px #f1c40f;
            opacity: 0;
        }

        .explode-anim {
            animation: flashExplode 0.8s ease-out forwards;
        }

        @keyframes flashExplode {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(80); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(150); opacity: 0; }
        }

        .groups-container {
            display: none;
            position: absolute;
            width: 100vw; height: 100vh;
            top: 0; left: 0;
            z-index: 15;
            padding: 15px;
        }

        .group-card {
            position: absolute;
            width: 180px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .group-card h3 {
            font-size: 14px;
            border-bottom: 2px solid #000;
            padding-bottom: 4px;
            margin-bottom: 6px;
            text-align: center;
        }

        .group-card ul { list-style: none; font-size: 12px; line-height: 1.5; }

        #group-dev { top: 15px; left: 15px; border-color: #f1c40f; background: #fffdf0; }
        #group-dev h3 { border-color: #f1c40f; color: #d35400; }
        #group-2 { top: 15px; right: 15px; }
        #group-3 { bottom: 15px; left: 15px; }
        #group-4 { bottom: 15px; right: 15px; }

        .game-box {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            z-index: 25;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .word-display { font-size: 26px; font-weight: bold; margin: 15px 0; color: #2c3e50; }
        .game-btns button {
            padding: 8px 16px;
            margin: 0 4px;
            border: 2px solid #000;
            background: #fff;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
        }
    </style>
</head>
